name: Public audit funnel validation

on:
  pull_request:
    paths:
      - "app/audit/**"
      - "app/api/audit/**"
      - "lib/audit-*.ts"
      - "app/sitemap.ts"
      - ".env.example"
      - ".github/workflows/public-audit-funnel-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-funnel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
