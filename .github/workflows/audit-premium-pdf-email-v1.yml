name: Audit Paid Funnel Boundary V1

on:
  pull_request:
    branches:
      - main
    paths:
      - "lib/audit-server.ts"
      - "lib/audit-paid-offers.ts"
      - "app/api/audit/report/route.ts"
      - "app/api/audit/report/[auditId]/route.ts"
      - "app/api/audit/order/route.ts"
      - "app/audit/audit-experience.tsx"
      - "app/audit/audit-offer-recommendation.tsx"
      - "app/audit/commande/**"
      - "scripts/audit-pdf-delivery-contract.mjs"
      - "docs/audit-premium-pdf-email-v1.md"
      - ".github/workflows/audit-premium-pdf-email-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate paid/free audit boundary
        run: node scripts/audit-pdf-delivery-contract.mjs

      - name: Lint funnel files
        run: >-
          pnpm exec eslint
          lib/audit-server.ts
          lib/audit-paid-offers.ts
          app/api/audit/report/route.ts
          'app/api/audit/report/[auditId]/route.ts'
          app/api/audit/order/route.ts
          app/audit/audit-experience.tsx
          app/audit/audit-offer-recommendation.tsx
          app/audit/commande/audit-order-form.tsx
          app/audit/commande/page.tsx

      - name: Build
        run: pnpm build
