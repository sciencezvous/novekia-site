name: Audit public score semantics one-shot

on:
  push:
    branches:
      - codex/public-audit-funnel-v1
    paths:
      - ".github/workflows/audit-result-actionability-once.yml"

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/public-audit-funnel-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Remove misleading public opportunity score
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ui = Path("app/audit/audit-experience.tsx")
          text = ui.read_text(encoding="utf-8")
          old = '''              <div className="bg-background p-5">\n                <p className="text-xs uppercase tracking-wide text-muted-foreground">\n                  Opportunité détectée\n                </p>\n                <p className="mt-2 text-2xl font-semibold text-primary">\n                  {result.opportunity_index}/100\n                </p>\n                <p className="mt-2 text-xs leading-5 text-muted-foreground">\n                  Marge d’amélioration retenue, pas une note globale du site.\n                </p>\n              </div>'''
          new = '''              <div className="bg-background p-5">\n                <p className="text-xs uppercase tracking-wide text-muted-foreground">\n                  Niveau d’opportunité\n                </p>\n                <p className="mt-2 text-xl font-semibold text-primary">\n                  {result.total_findings === 0\n                    ? 'Aucun point prioritaire'\n                    : result.opportunity_index <= 20\n                      ? 'Opportunités limitées'\n                      : result.opportunity_index <= 50\n                        ? 'Opportunités modérées'\n                        : 'Opportunités importantes'}\n                </p>\n                <p className="mt-2 text-xs leading-5 text-muted-foreground">\n                  Lecture qualitative des points retenus dans l’échantillon.\n                </p>\n              </div>'''
          if old not in text:
              raise SystemExit("public opportunity tile not found; refusing approximate patch")
          ui.write_text(text.replace(old, new, 1), encoding="utf-8")

          report = Path("app/api/audit/report/route.ts")
          text = report.read_text(encoding="utf-8")
          old = '''  const hasFindings = result.findings.length > 0\n  const verdict = hasFindings'''
          new = '''  const hasFindings = result.findings.length > 0\n  const opportunityLevel = !hasFindings\n    ? 'Aucun point prioritaire'\n    : result.opportunity_index <= 20\n      ? 'Opportunités limitées'\n      : result.opportunity_index <= 50\n        ? 'Opportunités modérées'\n        : 'Opportunités importantes'\n  const verdict = hasFindings'''
          if old not in text:
              raise SystemExit("report HTML insertion point not found")
          text = text.replace(old, new, 1)

          old = '''        <div style="padding:14px 16px;border:1px solid #e7e5e4;border-radius:8px"><div style="font-size:12px;color:#78716c">Indice d’opportunité</div><strong style="font-size:24px">${result.opportunity_index}/100</strong></div>'''
          new = '''        <div style="padding:14px 16px;border:1px solid #e7e5e4;border-radius:8px"><div style="font-size:12px;color:#78716c">Niveau d’opportunité</div><strong style="font-size:18px">${escapeHtml(opportunityLevel)}</strong></div>'''
          if old not in text:
              raise SystemExit("report opportunity card not found")
          text = text.replace(old, new, 1)

          old = '''      <p style="font-size:13px;line-height:1.55;color:#57534e"><strong>Comment lire ces chiffres :</strong> l’indice d’opportunité mesure la marge d’amélioration détectée dans l’échantillon, pas la qualité globale de votre site. Pages collectées : ${result.pages_collected}/${result.pages_planned}.</p>'''
          new = '''      <p style="font-size:13px;line-height:1.55;color:#57534e"><strong>Lecture :</strong> le niveau d’opportunité résume uniquement les points retenus dans l’échantillon public ; il ne s’agit pas d’une note globale de votre site. Pages collectées : ${result.pages_collected}/${result.pages_planned}.</p>'''
          if old not in text:
              raise SystemExit("report score explanation not found")
          text = text.replace(old, new, 1)

          old = '''function reportText(result: Awaited<ReturnType<typeof callAuditIngress>>) {\n  const hasFindings = result.findings.length > 0\n  const lines = ['''
          new = '''function reportText(result: Awaited<ReturnType<typeof callAuditIngress>>) {\n  const hasFindings = result.findings.length > 0\n  const opportunityLevel = !hasFindings\n    ? 'Aucun point prioritaire'\n    : result.opportunity_index <= 20\n      ? 'Opportunités limitées'\n      : result.opportunity_index <= 50\n        ? 'Opportunités modérées'\n        : 'Opportunités importantes'\n  const lines = ['''
          if old not in text:
              raise SystemExit("report text insertion point not found")
          text = text.replace(old, new, 1)

          old = '''    `Indice d'opportunité : ${result.opportunity_index}/100`,'''
          new = '''    `Niveau d'opportunité : ${opportunityLevel}`,'''
          if old not in text:
              raise SystemExit("report text opportunity line not found")
          text = text.replace(old, new, 1)

          old = '''    "L'indice d'opportunité mesure la marge d'amélioration détectée dans l'échantillon ; ce n'est pas une note de qualité globale du site.",'''
          new = '''    "Le niveau d'opportunité résume uniquement les points retenus dans l'échantillon public ; ce n'est pas une note globale du site.",'''
          if old not in text:
              raise SystemExit("report text score explanation not found")
          text = text.replace(old, new, 1)
          report.write_text(text, encoding="utf-8")
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Commit verified semantics
        shell: bash
        run: |
          git config user.name "novekia-ci"
          git config user.email "actions@users.noreply.github.com"
          git add app/audit/audit-experience.tsx app/api/audit/report/route.ts
          git rm .github/workflows/audit-result-actionability-once.yml
          git commit -m "fix(audit): make public opportunity result unambiguous"
          git push origin HEAD:codex/public-audit-funnel-v1
