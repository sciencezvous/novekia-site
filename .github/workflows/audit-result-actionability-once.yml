name: Audit score alignment one-shot

on:
  push:
    branches:
      - codex/public-audit-funnel-v1
    paths:
      - ".github/workflows/audit-result-actionability-once.yml"

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/public-audit-funnel-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Align public UI and email score semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ui = Path("app/audit/audit-experience.tsx")
          text = ui.read_text(encoding="utf-8")
          old = '''                    Score de visibilité observée'''
          new = '''                    Score pré-audit de visibilité'''
          if old not in text:
              raise SystemExit("UI score label not found")
          ui.write_text(text.replace(old, new, 1), encoding="utf-8")

          report = Path("app/api/audit/report/route.ts")
          text = report.read_text(encoding="utf-8")

          old = '''function reportHtml(result: Awaited<ReturnType<typeof callAuditIngress>>) {\n  const hasFindings = result.findings.length > 0\n  const verdict = hasFindings'''
          new = '''function reportHtml(result: Awaited<ReturnType<typeof callAuditIngress>>) {\n  const hasFindings = result.findings.length > 0\n  const score = Math.max(0, Math.min(100, 100 - result.opportunity_index))\n  const scoreLabel =\n    score >= 90\n      ? 'Très bon niveau'\n      : score >= 75\n        ? 'Bon niveau'\n        : score >= 55\n          ? 'Base exploitable à renforcer'\n          : 'Potentiel d’amélioration important'\n  const verdict = hasFindings'''
          if old not in text:
              raise SystemExit("report HTML score insertion point not found")
          text = text.replace(old, new, 1)

          old = '''        <div style="padding:14px 16px;border:1px solid #e7e5e4;border-radius:8px"><div style="font-size:12px;color:#78716c">Indice d’opportunité</div><strong style="font-size:24px">${result.opportunity_index}/100</strong></div>'''
          new = '''        <div style="padding:14px 16px;border:1px solid #e7e5e4;border-radius:8px"><div style="font-size:12px;color:#78716c">Score pré-audit de visibilité</div><strong style="font-size:24px">${score}/100</strong><div style="margin-top:4px;font-size:13px;font-weight:700;color:#1d4ed8">${escapeHtml(scoreLabel)}</div></div>'''
          if old not in text:
              raise SystemExit("report score card not found")
          text = text.replace(old, new, 1)

          old = '''      <p style="font-size:13px;line-height:1.55;color:#57534e"><strong>Comment lire ces chiffres :</strong> l’indice d’opportunité mesure la marge d’amélioration détectée dans l’échantillon, pas la qualité globale de votre site. Pages collectées : ${result.pages_collected}/${result.pages_planned}.</p>'''
          new = '''      <p style="font-size:13px;line-height:1.55;color:#57534e"><strong>Comment lire ce score :</strong> plus il est élevé, moins le moteur a retenu de corrections prioritaires dans l’échantillon public analysé. Les corrections détectées restent listées ci-dessous. Ce score est borné à l’échantillon : ce n’est ni une certification ni une note exhaustive du site. Pages collectées : ${result.pages_collected}/${result.pages_planned}.</p>'''
          if old not in text:
              raise SystemExit("report score explanation not found")
          text = text.replace(old, new, 1)

          old = '''function reportText(result: Awaited<ReturnType<typeof callAuditIngress>>) {\n  const hasFindings = result.findings.length > 0\n  const lines = ['''
          new = '''function reportText(result: Awaited<ReturnType<typeof callAuditIngress>>) {\n  const hasFindings = result.findings.length > 0\n  const score = Math.max(0, Math.min(100, 100 - result.opportunity_index))\n  const scoreLabel =\n    score >= 90\n      ? 'Très bon niveau'\n      : score >= 75\n        ? 'Bon niveau'\n        : score >= 55\n          ? 'Base exploitable à renforcer'\n          : 'Potentiel d’amélioration important'\n  const lines = ['''
          if old not in text:
              raise SystemExit("report text score insertion point not found")
          text = text.replace(old, new, 1)

          old = '''    `Indice d'opportunité : ${result.opportunity_index}/100`,'''
          new = '''    `Score pré-audit de visibilité : ${score}/100 — ${scoreLabel}`,'''
          if old not in text:
              raise SystemExit("report text score line not found")
          text = text.replace(old, new, 1)

          old = '''    "L'indice d'opportunité mesure la marge d'amélioration détectée dans l'échantillon ; ce n'est pas une note de qualité globale du site.",'''
          new = '''    "Plus le score est élevé, moins le moteur a retenu de corrections prioritaires dans l'échantillon analysé. Les corrections restantes sont détaillées ci-dessous. Ce score est borné à l'échantillon et ne constitue ni une certification ni une note exhaustive du site.",'''
          if old not in text:
              raise SystemExit("report text score explanation not found")
          text = text.replace(old, new, 1)
          report.write_text(text, encoding="utf-8")
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Commit verified score alignment
        shell: bash
        run: |
          git config user.name "novekia-ci"
          git config user.email "actions@users.noreply.github.com"
          git add app/audit/audit-experience.tsx app/api/audit/report/route.ts
          git rm .github/workflows/audit-result-actionability-once.yml
          git commit -m "fix(audit): align positive pre-audit score across funnel"
          git push origin HEAD:codex/public-audit-funnel-v1
